name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: LumaLauncher-Windows
          path: release/*.exe
