<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Luma Launcher</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Luma"><span class="brand-symbol">✦</span><span>luma<span class="brand-dot">.</span></span></a>
      <div class="sidebar-caption" data-i18n="tagline"></div>
      <div class="nav-section-label" data-i18n="launcherSettings"></div>
      <nav aria-label="Luma">
        <button class="nav-item active" data-view="client"><i data-icon="roblox"></i><span data-i18n="client"></span><span class="nav-spark">✦</span></button>
        <button class="nav-item" data-view="appearance"><i data-icon="palette"></i><span data-i18n="appearance"></span></button>
        <button class="nav-item" data-view="behavior"><i data-icon="settings"></i><span data-i18n="behavior"></span></button>
        <button class="nav-item" data-view="diagnostics"><i data-icon="pulse"></i><span data-i18n="diagnostics"></span></button>
      </nav>
      <div class="nav-section-label spaced" data-i18n="collection"></div>
      <nav>
        <button class="nav-item" data-view="library"><i data-icon="grid"></i><span data-i18n="library"></span><span id="nav-count" class="nav-count">0</span></button>
        <button class="nav-item" data-view="history"><i data-icon="clock"></i><span data-i18n="history"></span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-launch"><span class="mini-roblox">◈</span><strong>Roblox Player</strong><small id="sidebar-client-status"></small></div>
        <button class="nav-item" data-view="about"><i data-icon="info"></i><span data-i18n="about"></span></button>
        <div class="sidebar-footer"><span class="status-dot"></span> Luma 0.3 <span>WINDOWS</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="titlebar"><span class="titlebar-label">LUMA LAUNCHER <span>/</span> 0.3.0</span><div class="window-controls"><button data-i18n-aria="minimize" data-window="minimize"><i data-icon="minus"></i></button><button data-i18n-aria="maximize" data-window="maximize"><i data-icon="maximize"></i></button><button data-i18n-aria="close" data-window="close"><i data-icon="x"></i></button></div></header>
      <main id="main" tabindex="-1">
        <div class="toolbar"><div><div class="eyebrow" id="page-eyebrow"></div><h1 id="page-title"></h1></div><div class="toolbar-actions"><label class="search-box" hidden><i data-icon="search"></i><input id="search" type="search" data-i18n-placeholder="search" data-i18n-aria="search"><kbd>Ctrl K</kbd></label><select id="language" class="language-select" data-i18n-aria="language"><option value="ru">RU · Русский</option><option value="en">EN · English</option></select><button class="icon-button" id="add-top" data-i18n-aria="addGame" hidden><i data-icon="plus"></i></button></div></div>
        <div id="warning" class="warning" role="alert" hidden></div><div id="content" class="content"></div>
        <footer class="main-footer"><span data-i18n="independent"></span><span><span data-i18n="affiliation"></span> <span class="tiny-spark">✦</span></span></footer>
      </main>
    </div>
  </div>
  <dialog id="game-dialog" class="modal"><form id="game-form" novalidate>
    <div class="modal-top"><span class="modal-icon"><i data-icon="plus"></i></span><button type="button" class="icon-button modal-close" data-i18n-aria="close"><i data-icon="x"></i></button></div>
    <div class="eyebrow">LUMA / ROBLOX</div><h2 data-i18n="newGame"></h2><p class="modal-description" data-i18n="addDescription"></p>
    <label class="field-label" for="game-name" data-i18n="gameName"></label><input id="game-name" class="field" maxlength="80" data-i18n-placeholder="namePlaceholder" autocomplete="off">
    <label class="field-label" for="game-link" data-i18n="gameLink"></label><input id="game-link" class="field" maxlength="500" placeholder="https://www.roblox.com/games/…" autocomplete="off"><div class="field-help" data-i18n="linkHelp"></div>
    <span class="field-label" data-i18n="cover"></span><div id="art-picker" class="art-picker" role="group" data-i18n-aria="cover"></div><div class="field-help" data-i18n="coverHelp"></div>
    <p id="form-error" class="form-error" role="alert"></p><button type="submit" class="button primary full" id="save-game"><i data-icon="plus"></i><span data-i18n="saveGame"></span></button>
  </form></dialog>
  <dialog id="confirm-dialog" class="modal confirm-modal"><div class="eyebrow">LUMA LAUNCHER</div><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="confirm-actions"><button class="button secondary" id="confirm-cancel" data-i18n="cancel"></button><button class="button danger" id="confirm-accept"></button></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <script src="i18n.js"></script><script src="app.js"></script>
</body>
</html>
